name: Generate Wallpaper Index

on:
  push:
    branches: [main]
    paths:
      - 'wallpapers/**'
      - 'categories.json'
      - 'scripts/generate_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate thumbnails
        run: bash scripts/generate-thumbnails.sh
        continue-on-error: true

      - name: Generate JSON index
        run: python3 scripts/generate_index.py

      - name: Verify generated files
        run: |
          echo "── wallpapers.json ──"
          ls -la wallpapers.json || echo "MISSING!"
          echo ""
          echo "── wallpapers.json summary ──"
          python3 -c "
          import json
          with open('wallpapers.json') as f:
              data = json.load(f)
          print(f\"Total: {data['total']}\")
          for cid, cat in data['categories'].items():
              print(f\"  {cat['icon']} {cat['name']}: {cat['count']}\")
          "

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wallpapers.json
          git add -f thumbnails/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "✓ No changes to commit."
          else
            git commit -m "chore: update wallpaper index [skip ci]"
            git push
            echo "✓ Pushed."
          fi
